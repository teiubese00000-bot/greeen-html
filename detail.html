<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a class="brand" id="" href="index.html"> 게시판</a>
        <nav>
            <a href="index.html">게시판</a>
            <a class="write-link" href="write.html"> 글쓰기 </a>
            <a class="login-link" href="login.html"> 로그인 </a>
            <button class="logout-button" type="button"> 로그아웃</button>
        </nav>
    </header>
    <main>
        <article>
            <h1 id="post-title">첫번째 글</h1>
            <p id="post-meta" class="meta">학생 /2026-10-03</p>
            <p id="post-content">게시판 실습내용</p>
        </article>
        <a href="index.html">목록으로</a>

        <section id="comments-section">
            <h2>댓글</h2>
            <!---댓글 목록영역----->

                <li>
                    <strong>학생</strong>
                    <p>첫댓글</p>
                </li>
            </ul>
            <!---댓글 입력창----->

            <form id="comment-form">
                <label>댓글내용</label>
                <textarea id="comment-content" name="content" required></textarea>
                <button type="button">등록</button>
            </form>
        </section>

    </main>
    <footer>

        게시판 실습
    </footer>
